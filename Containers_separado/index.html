<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Menu Principal — Controle de Containers</title>
<link rel="stylesheet" href="./assets/estilos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
</head>
<body class="pagina-separada" data-pagina="menu">
<div aria-label="Carregando aplicativo" id="tela-carregamento-app">
<img alt="Logo Controle de Containers" id="tela-carregamento-logo" onerror="this.style.display='none'" src="./icon-192.png"/>
<div class="carregamento-titulo">Controle de Containers</div>
<div class="carregamento-percentual" id="carregamento-percentual">0%</div>
<div aria-hidden="true" class="carregamento-barra">
<div id="carregamento-progresso"></div>
</div>
</div>
<div class="tela-login" id="tela-login">
<div class="cartao-login">
<div class="logo-login-container">
<img alt="Logo Controle de Containers" class="logo-login" onerror="this.style.display='none'" src="./icon-192.png">
</img></div>
<h1>📦 Controle de Containers</h1>
<div class="subtitulo-login" id="subtitulo-login">
Entre com seu usuário e senha
</div>
<div class="erro-login" id="erro-login"></div>
<div id="bloco-login-normal">
<div class="campo-login campo-login-usuario-persistente">
<label>👤 Usuário: <span class="cadeado-usuario-login" id="icone-cadeado-usuario-login" title="Usuário fixado neste dispositivo">🔒</span></label>
<input autocomplete="username" id="login-usuario" placeholder="Digite seu usuário" type="email"/>
</div>
<div class="campo-login">
<label>🔒 Senha:</label>
<input autocomplete="off" id="login-senha" placeholder="Digite sua senha" type="password"/>
</div>
<button class="btn-login" id="btn-acao-login" onclick="tratarEnvioLogin()" type="button">
Entrar
</button>
<div aria-label="Tema da tela de login" class="controle-tema-login">
<span>🎨 Tema:</span>
<button id="btn-tema-login-claro" onclick="definirTemaAntesDoLogin('claro')" type="button">☀️ Claro</button>
<button id="btn-tema-login-escuro" onclick="definirTemaAntesDoLogin('escuro')" type="button">🌙 Escuro</button>
</div>
<div class="alternar-login" id="alternar-login" style="display:block;">
<a onclick="abrirSolicitacaoNovoAcesso()">Solicitar novo acesso</a>
<br/>
<a class="link-outro-usuario" onclick="logarOutroUsuario()">Logar outro usuário</a>
</div>
</div>
<!-- SOLICITAÇÃO DE NOVO ACESSO -->
<div id="painel-recuperar-senha" style="display:none;">
<div class="erro-login" id="erro-recuperar"></div>
<div style="background:var(--azul-fraco);border:1px solid var(--azul-forte);color:var(--texto);padding:10px;border-radius:8px;font-size:11.5px;margin-bottom:12px;">
        🔐 Informe seus dados. A solicitação será enviada ao administrador pelo Firebase.
    </div>
<div class="campo-login">
<label>👤 Nome:</label>
<input autocomplete="off" id="recuperar-nome" placeholder="Nome" type="text"/>
</div>
<div class="campo-login">
<label>👤 Sobrenome:</label>
<input autocomplete="off" id="recuperar-sobrenome" placeholder="Sobrenome" type="text"/>
</div>
<div class="campo-login">
<label>🏢 Filial:</label>
<select id="recuperar-filial">
<option value="">Selecione a filial</option>
<option value="ST. AFONSO">ST. AFONSO</option>
<option value="LAGOA">LAGOA</option>
<option value="MINISTRO">MINISTRO</option>
<option value="MATRIZ">MATRIZ</option>
</select>
</div>
<div class="campo-login">
<label>📧 E-mail:</label>
<input autocomplete="off" id="recuperar-usuario" placeholder="E-mail para o novo acesso" type="email"/>
</div>
<button class="btn-login" onclick="enviarSolicitacaoNovoAcesso()" type="button">
        📨 Solicitar acesso
    </button>
<div class="alternar-login" style="display:block;">
<a onclick="esconderRecuperarSenha()">← Voltar para o login</a>
</div>
</div>
</div>
</div>
<div id="tela-menu" style="display:none;">
<div class="barra-usuario">
<span id="texto-usuario-menu"></span>
<button class="btn-atualizar-sistema" onclick="atualizarSistemaSemDeslogar()" type="button">🔄 Atualizar</button>
<button class="btn-sair" onclick="sairDoSistema()" type="button">🚪 Sair</button>
</div>
<div class="menu-principal-caixa">
<h1 style="margin:0 0 4px;">📦 Menu Principal</h1>
<div style="font-size:12px;color:var(--texto-fraco);margin-bottom:18px;">Selecione uma tela para continuar.</div>
<div class="lista-menu-principal" id="lista-menu-principal">
<button class="item-menu-principal" data-tela="containers" onclick="abrirTelaDoMenu('containers')" type="button">
<span class="item-menu-icone">📦</span>
<span class="item-menu-texto"><strong>Containers</strong><small>Entradas, mapa e status dos containers</small></span>
<span class="item-menu-seta">›</span>
</button>
<button class="item-menu-principal" data-tela="relatorios" onclick="abrirTelaDoMenu('relatorios')" type="button">
<span class="item-menu-icone">📊</span>
<span class="item-menu-texto"><strong>Relatórios</strong><small>Movimentações, registros e solicitações</small></span>
<span class="item-menu-seta">›</span>
</button>
<button class="item-menu-principal" data-tela="kardex" onclick="abrirTelaDoMenu('kardex')" type="button">
<span class="item-menu-icone">📋</span>
<span class="item-menu-texto"><strong>Kardex</strong><small>Consulta detalhada de movimentações por produto/lote</small></span>
<span class="item-menu-seta">›</span>
</button>
<button class="item-menu-principal" data-tela="produtos" onclick="abrirTelaDoMenu('produtos')" type="button">
<span class="item-menu-icone">🏷️</span>
<span class="item-menu-texto"><strong>Cadastro de Produtos</strong><small>Adicionar, editar e excluir produtos</small></span>
<span class="item-menu-seta">›</span>
</button>
<button class="item-menu-principal" data-tela="usuarios" onclick="abrirTelaDoMenu('usuarios')" type="button">
<span class="item-menu-icone">👥</span>
<span class="item-menu-texto"><strong>Cadastro de Usuários</strong><small>Redefinir senha, bloquear e gerenciar acessos</small></span>
<span class="item-menu-seta">›</span>
</button>
<button class="item-menu-principal item-menu-sair" data-tela="sair" onclick="sairDoSistema()" type="button">
<span class="item-menu-icone">🚪</span>
<span class="item-menu-texto"><strong>Sair do Sistema</strong><small>Encerrar a sessão atual</small></span>
<span class="item-menu-seta">›</span>
</button>
</div>
</div>
</div>
<script src="./assets/sistema.js"></script>
<script src="./assets/navegacao-separada.js"></script>
</body>
</html>
