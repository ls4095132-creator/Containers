<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Configuração do Sistema</title>
<link rel="stylesheet" href="./configuracao.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
</head>
<body class="carregando">
<div class="pagina">
    <div class="cabecalho">
        <h1>⚙️ Configuração do Sistema</h1>
        <button type="button" onclick="voltarSistema()">⬅️ Voltar ao sistema</button>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <section class="card">
        <h2>🖥️ Sistema</h2>
        <label for="nomeSistema">Nome do sistema</label>
        <input id="nomeSistema" type="text" placeholder="Controle de Containers">

        <label for="quantidadeContainers">Quantidade de containers</label>
        <input id="quantidadeContainers" type="number" min="1" max="999">
    </section>

    <section class="card">
        <h2>🔐 Acesso Digital</h2>
        <p>Cadastro e gerenciamento dos usuários do sistema.</p>

        <div class="novo-usuario">
            <label for="novoUsuarioEmail">E-mail do novo usuário</label>
            <input id="novoUsuarioEmail" type="text" placeholder="usuario@exemplo.com">

            <label for="novoUsuarioSenha">Senha (mínimo 6 caracteres)</label>
            <input id="novoUsuarioSenha" type="text" placeholder="Senha provisória">

            <label for="novoUsuarioTipo">Tipo de acesso</label>
            <select id="novoUsuarioTipo" onchange="atualizarFilialNovoUsuario()">
                <option value="usuario">Usuário comum</option>
                <option value="admin">Administrador</option>
                <option value="externo">Usuário externo</option>
            </select>

            <label for="novoUsuarioFilial">Filial</label>
            <select id="novoUsuarioFilial">
                <option value="ST. AFONSO">ST. AFONSO</option>
            </select>

            <div id="erroNovoUsuario" class="mensagem erro" style="display:none;"></div>

            <button type="button" class="salvar" onclick="cadastrarUsuario()">➕ Cadastrar Usuário</button>
        </div>

        <div class="lista-usuarios-cabecalho">
            <strong>👥 Usuários cadastrados</strong>
            <span id="contadorUsuarios"></span>
        </div>
        <div id="listaUsuarios" class="lista-usuarios">Carregando...</div>
    </section>

    <section class="card">
        <h2>🎨 Tema</h2>
        <p>O tema escuro é o padrão atual do sistema.</p>
        <div class="tema-botoes">
            <button type="button" class="tema-opcao" id="btnTemaEscuro" onclick="definirTema('escuro')">🌙 Escuro</button>
            <button type="button" class="tema-opcao" id="btnTemaClaro" onclick="definirTema('claro')">☀️ Claro</button>
        </div>
    </section>

    <section class="card">
        <h2>🔔 Notificações</h2>

        <label class="check">
            <input id="notificacoesGerais" type="checkbox">
            Notificações gerais
        </label>

        <label class="check">
            <input id="avisosEntrada" type="checkbox">
            Avisos de entrada de mercadoria
        </label>

        <label class="check">
            <input id="avisosRecusa" type="checkbox">
            Avisos de mercadoria recusada
        </label>
    </section>

    <section class="card">
        <button class="salvar" type="button" onclick="salvarConfiguracoes()">💾 Salvar configurações</button>
    </section>
</div>
<script src="./configuracao.js"></script>
</body>
</html>
